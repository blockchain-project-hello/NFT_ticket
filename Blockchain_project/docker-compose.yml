version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: nft_ticketing_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nft_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
